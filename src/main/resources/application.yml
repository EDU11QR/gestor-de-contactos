spring:
  application:
    name: gestor-contactos
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gestor_contactos?serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  session:
    store-type: jdbc
    jdbc:
      table-name: SPRING_SESSION
      initialize-schema: never
    timeout: ${SPRING_SESSION_TIMEOUT:7d}
server:
  servlet:
    session:
      cookie:
        name: ${SERVER_SERVLET_SESSION_COOKIE_NAME:GESTOR_SESSION}
        max-age: ${SERVER_SERVLET_SESSION_COOKIE_MAX_AGE:7d}
        http-only: ${SERVER_SERVLET_SESSION_COOKIE_HTTP_ONLY:true}
        secure: ${SERVER_SERVLET_SESSION_COOKIE_SECURE:true}
        same-site: ${SERVER_SERVLET_SESSION_COOKIE_SAME_SITE:lax}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}
app:
  provisioning:
    email: ${APP_PROVISIONING_EMAIL:}
    password: ${APP_PROVISIONING_PASSWORD:}
    nombre: ${APP_PROVISIONING_NOMBRE:}
  fotos:
    dir: ${APP_PHOTOS_DIR}
