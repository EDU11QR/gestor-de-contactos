<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.9/css/bootstrap.min.css}">
</head>
<body class="container py-5">
<main class="mx-auto" style="max-width: 32rem;">
    <h1 class="h3 mb-4">Iniciar sesión</h1>

    <div class="alert alert-danger" th:if="${param.error}">
        Correo electrónico o contraseña incorrectos.
    </div>
    <div class="alert alert-success" th:if="${param.logout}">
        La sesión se cerró correctamente.
    </div>

    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mb-3">
            <label class="form-label" for="email">Correo electrónico</label>
            <input class="form-control" id="email" name="username" type="email" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Contraseña</label>
            <input class="form-control" id="password" name="password" type="password" required>
        </div>
        <button class="btn btn-primary" type="submit">Entrar</button>
    </form>

    <p class="mt-3"><a th:href="@{/}">Volver al inicio</a></p>
</main>
<script th:src="@{/webjars/bootstrap/5.3.9/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
