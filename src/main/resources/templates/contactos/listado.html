<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contactos</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.9/css/bootstrap.min.css}">
</head>
<body class="container py-5">
<main class="mx-auto" style="max-width: 72rem;">
    <h1 class="h3 mb-4">Contactos</h1>

    <div class="alert alert-success" th:if="${eliminado}">Contacto eliminado correctamente.</div>
    <div class="alert alert-danger" th:if="${errorEliminacion}" th:text="${errorEliminacion}"></div>
    <div class="alert alert-danger" th:if="${errorFiltro}" th:text="${errorFiltro}"></div>

    <form class="row g-3 mb-4" th:action="@{/contactos}" th:object="${filtro}" method="get">
        <div class="col-md-6">
            <label class="form-label" for="termino">Buscar</label>
            <input class="form-control" id="termino" type="text" th:field="*{termino}" maxlength="100"
                   placeholder="Nombres, apellidos o DNI">
        </div>
        <div class="col-md-3">
            <label class="form-label" for="tipo">Clasificación</label>
            <select class="form-select" id="tipo" th:field="*{tipo}">
                <option value="">Todos</option>
                <option th:each="tipo : ${tipos}" th:value="${tipo}" th:text="${tipo}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label" for="size">Tamaño de página</label>
            <select class="form-select" id="size" th:field="*{size}">
                <option value="10">10</option>
                <option value="20">20</option>
                <option value="50">50</option>
            </select>
        </div>
        <input type="hidden" name="page" value="0">
        <div class="col-12 d-flex gap-2">
            <button class="btn btn-primary" type="submit">Buscar</button>
            <a class="btn btn-outline-secondary" th:href="@{/contactos}">Limpiar</a>
            <a class="btn btn-link" th:href="@{/contactos/nuevo}">Registrar contacto</a>
        </div>
    </form>

    <div class="alert alert-info" th:if="${pagina.empty}">No se encontraron contactos.</div>

    <table class="table table-striped table-hover" th:if="${!pagina.empty}">
        <thead>
        <tr>
            <th>Nombres</th>
            <th>Apellidos</th>
            <th>DNI</th>
            <th>Clasificación</th>
            <th>Acción</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="contacto : ${pagina.content}">
            <td th:text="${contacto.nombres}"></td>
            <td th:text="${contacto.apellidos}"></td>
            <td th:text="${contacto.dni}"></td>
            <td th:text="${contacto.tipoContacto}"></td>
            <td>
                <a th:href="@{/contactos/{id}(id=${contacto.id})}">Ver</a>
            </td>
        </tr>
        </tbody>
    </table>

    <nav class="d-flex align-items-center gap-2 mt-3" th:if="${pagina.totalPages > 0}">
        <a class="btn btn-outline-primary btn-sm" th:if="${!pagina.first}"
           th:href="@{/contactos(termino=${filtro.termino},tipo=${filtro.tipo},size=${pagina.size},page=${pagina.number - 1})}">Anterior</a>
        <span th:text="${'Página ' + (pagina.number + 1) + ' de ' + pagina.totalPages}"></span>
        <a class="btn btn-outline-primary btn-sm" th:if="${!pagina.last}"
           th:href="@{/contactos(termino=${filtro.termino},tipo=${filtro.tipo},size=${pagina.size},page=${pagina.number + 1})}">Siguiente</a>
    </nav>

    <p class="mt-3"><a th:href="@{/}">Volver al inicio</a></p>
</main>
<script th:src="@{/webjars/bootstrap/5.3.9/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
