<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::contenido}, 'Contactos', 'contactos', false)}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contactos</title>
</head>
<body>
<div th:fragment="contenido">
    <section class="app-card mb-4">
        <div class="app-card__cabecera">
            <h1 class="app-card__titulo">Contactos</h1>
            <p class="app-card__descripcion">Busque, filtre y consulte el directorio de contactos.</p>
        </div>
        <div class="app-card__cuerpo">
            <form class="app-busqueda" th:action="@{/contactos}" th:object="${filtro}" method="get">
                <div class="app-form-field">
                    <label class="app-form-label" for="termino">Buscar</label>
                    <input class="form-control" id="termino" type="text" th:field="*{termino}" maxlength="100"
                           placeholder="Nombres, apellidos o DNI">
                </div>
                <div class="app-form-field">
                    <label class="app-form-label" for="tipo">Clasificación</label>
                    <select class="form-select" id="tipo" th:field="*{tipo}">
                        <option value="">Todos</option>
                        <option th:each="tipo : ${tipos}" th:value="${tipo}" th:text="${tipo}"></option>
                    </select>
                </div>
                <div class="app-form-field">
                    <label class="app-form-label" for="size">Tamaño de página</label>
                    <select class="form-select" id="size" th:field="*{size}">
                        <option value="10">10</option>
                        <option value="20">20</option>
                        <option value="50">50</option>
                    </select>
                </div>
                <input type="hidden" name="page" value="0">
                <div class="app-acciones">
                    <button class="btn btn-primary" type="submit">Buscar</button>
                    <a class="btn btn-outline-secondary" th:href="@{/contactos}">Limpiar</a>
                </div>
            </form>
        </div>
    </section>

    <section class="app-card">
        <div class="app-card__cabecera d-flex flex-wrap align-items-center justify-content-between gap-2">
            <h2 class="app-card__titulo">Resultados</h2>
            <a class="btn btn-sm btn-primary" th:href="@{/contactos/nuevo}">Registrar contacto</a>
        </div>
        <div class="app-card__cuerpo">
            <div class="app-vacio" th:if="${pagina.empty}">
                <p class="app-vacio__titulo">No se encontraron contactos.</p>
                <p class="app-vacio__texto">Ajuste los filtros o registre un contacto nuevo.</p>
            </div>

            <div class="app-tabla-responsive" th:if="${!pagina.empty}">
                <table class="table app-tabla table-hover">
                    <thead>
                    <tr>
                        <th>Nombres</th>
                        <th>Apellidos</th>
                        <th>DNI</th>
                        <th>Clasificación</th>
                        <th>Acción</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="contacto : ${pagina.content}">
                        <td th:text="${contacto.nombres}"></td>
                        <td th:text="${contacto.apellidos}"></td>
                        <td th:text="${contacto.dni}"></td>
                        <td><span class="badge rounded-pill text-bg-primary" th:text="${contacto.tipoContacto}"></span></td>
                        <td>
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{/contactos/{id}(id=${contacto.id})}">Ver</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <nav class="app-paginacion" th:if="${pagina.totalPages > 0}">
                <a class="btn btn-sm btn-outline-primary" th:if="${!pagina.first}"
                   th:href="@{/contactos(termino=${filtro.termino},tipo=${filtro.tipo},size=${pagina.size},page=${pagina.number - 1})}">Anterior</a>
                <span th:text="${'Página ' + (pagina.number + 1) + ' de ' + pagina.totalPages}"></span>
                <a class="btn btn-sm btn-outline-primary" th:if="${!pagina.last}"
                   th:href="@{/contactos(termino=${filtro.termino},tipo=${filtro.tipo},size=${pagina.size},page=${pagina.number + 1})}">Siguiente</a>
            </nav>
        </div>
    </section>
</div>
</body>
</html>
