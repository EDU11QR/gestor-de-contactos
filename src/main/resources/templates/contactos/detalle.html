<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::contenido}, 'Detalle del contacto', 'contactos', false)}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle del contacto</title>
</head>
<body>
<div th:fragment="contenido">
    <section class="app-card">
        <div class="app-card__cabecera">
            <h1 class="app-card__titulo">Detalle del contacto</h1>
            <p class="app-card__descripcion">Información registrada y acciones disponibles.</p>
        </div>
        <div class="app-card__cuerpo">
            <dl class="row app-detalle">
                <dt class="col-sm-4">Nombres</dt>
                <dd class="col-sm-8" th:text="${contacto.nombres}"></dd>

                <dt class="col-sm-4">Apellidos</dt>
                <dd class="col-sm-8" th:text="${contacto.apellidos}"></dd>

                <dt class="col-sm-4">DNI</dt>
                <dd class="col-sm-8" th:text="${contacto.dni}"></dd>

                <dt class="col-sm-4">Tipo</dt>
                <dd class="col-sm-8"><span class="badge rounded-pill text-bg-primary"
                                           th:text="${contacto.tipoContacto}"></span></dd>

                <dt class="col-sm-4">Teléfono</dt>
                <dd class="col-sm-8">
                    <span class="d-block" th:each="telefono : ${contacto.telefonos}"
                          th:text="${telefono}"></span>
                </dd>

                <dt class="col-sm-4">Correo electrónico</dt>
                <dd class="col-sm-8">
                    <span class="d-block" th:each="correo : ${contacto.correosElectronicos}"
                          th:text="${correo}"></span>
                </dd>

                <dt class="col-sm-4">Fotografía</dt>
                <dd class="col-sm-8"
                    th:text="${contacto.fotoContentType} + ' (' + ${contacto.fotoTamanoBytes} + ' bytes)'"></dd>
            </dl>

            <div class="app-acciones app-acciones--final">
                <a class="btn btn-primary" th:href="@{/contactos/{id}/editar(id=${contacto.id})}">Editar</a>
                <a class="btn btn-outline-danger"
                   th:href="@{/contactos/{id}/eliminar(id=${contacto.id})}">Eliminar</a>
                <a class="btn btn-outline-secondary" th:href="@{/contactos}">Volver al listado</a>
            </div>
        </div>
    </section>
</div>
</body>
</html>
