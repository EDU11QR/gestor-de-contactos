<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::contenido}, 'Registrar contacto', 'nuevo', false)}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrar contacto</title>
</head>
<body>
<div th:fragment="contenido">
    <section class="app-card">
        <div class="app-card__cabecera">
            <h1 class="app-card__titulo">Registrar contacto</h1>
            <p class="app-card__descripcion">Complete los datos obligatorios para incorporar un contacto.</p>
        </div>
        <div class="app-card__cuerpo">
            <form th:action="@{/contactos}" th:object="${form}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="app-form-grid">
                    <div class="app-form-field">
                        <label class="app-form-label" for="nombres">Nombres</label>
                        <input class="form-control" id="nombres" th:field="*{nombres}" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('nombres')}"
                             th:errors="*{nombres}"></div>
                    </div>

                    <div class="app-form-field">
                        <label class="app-form-label" for="apellidos">Apellidos</label>
                        <input class="form-control" id="apellidos" th:field="*{apellidos}" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('apellidos')}"
                             th:errors="*{apellidos}"></div>
                    </div>

                    <div class="app-form-field">
                        <label class="app-form-label" for="dni">DNI</label>
                        <input class="form-control" id="dni" th:field="*{dni}" inputmode="numeric" maxlength="8"
                               required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></div>
                    </div>

                    <div class="app-form-field">
                        <label class="app-form-label" for="tipoContacto">Tipo de contacto</label>
                        <select class="form-select" id="tipoContacto" th:field="*{tipoContacto}" required>
                            <option value="">Seleccione...</option>
                            <option th:each="tipo : ${tipos}" th:value="${tipo}" th:text="${tipo}">CLIENTE</option>
                        </select>
                        <div class="text-danger small" th:if="${#fields.hasErrors('tipoContacto')}"
                             th:errors="*{tipoContacto}"></div>
                    </div>

                    <div class="app-form-field">
                        <label class="app-form-label" for="telefono">Teléfono móvil</label>
                        <input class="form-control" id="telefono" type="tel" th:field="*{telefonos[0].numero}"
                               maxlength="50" required>
                        <div class="text-danger small" th:if="${#fields.hasErrors('telefonos[0].numero')}"
                             th:errors="*{telefonos[0].numero}"></div>
                    </div>

                    <div class="app-form-field">
                        <label class="app-form-label" for="correo">Correo electrónico</label>
                        <input class="form-control" id="correo" type="email"
                               th:field="*{correosElectronicos[0].direccion}" maxlength="255" required>
                        <div class="text-danger small"
                             th:if="${#fields.hasErrors('correosElectronicos[0].direccion')}"
                             th:errors="*{correosElectronicos[0].direccion}"></div>
                    </div>

                    <div class="app-form-field app-form-field--completo">
                        <label class="app-form-label" for="foto">Fotografía</label>
                        <input class="form-control" id="foto" type="file" accept="image/jpeg,image/png"
                               th:field="*{foto}" required>
                        <div class="form-text">Formatos aceptados: JPG o PNG. Tamaño máximo: 2 MB.</div>
                        <div class="text-danger small" th:if="${#fields.hasErrors('foto')}" th:errors="*{foto}"></div>
                    </div>
                </div>

                <div class="app-acciones app-acciones--final">
                    <button class="btn btn-primary" type="submit">Guardar</button>
                    <a class="btn btn-outline-secondary" th:href="@{/contactos}">Ver contactos</a>
                </div>
            </form>
        </div>
    </section>
</div>
</body>
</html>
