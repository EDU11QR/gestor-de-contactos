<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar contacto</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.9/css/bootstrap.min.css}">
</head>
<body class="container py-5">
<main class="mx-auto" style="max-width: 48rem;">
    <h1 class="h3 mb-4">Editar contacto</h1>

    <form id="formulario-edicion" th:action="@{/contactos/{id}/editar(id=${id})}" th:object="${form}"
          method="post" enctype="multipart/form-data">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="mb-3">
            <label class="form-label" for="nombres">Nombres</label>
            <input class="form-control" id="nombres" th:field="*{nombres}" required>
            <div class="text-danger" th:if="${#fields.hasErrors('nombres')}" th:errors="*{nombres}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="apellidos">Apellidos</label>
            <input class="form-control" id="apellidos" th:field="*{apellidos}" required>
            <div class="text-danger" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="dni">DNI</label>
            <input class="form-control" id="dni" th:field="*{dni}" inputmode="numeric" maxlength="8" required>
            <div class="text-danger" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="tipoContacto">Tipo de contacto</label>
            <select class="form-select" id="tipoContacto" th:field="*{tipoContacto}" required>
                <option value="">Seleccione...</option>
                <option th:each="tipo : ${tipos}" th:value="${tipo}" th:text="${tipo}">CLIENTE</option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('tipoContacto')}"
                 th:errors="*{tipoContacto}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Teléfonos móviles</label>
            <div id="telefonos">
                <div class="row g-2 mb-2 telefono-fila" th:each="telefono, estado : *{telefonos}">
                    <div class="col">
                        <label class="form-label" th:for="'telefono' + ${estado.index}">Teléfono</label>
                        <input class="form-control campo-telefono" type="tel" maxlength="50" required
                               th:id="'telefono' + ${estado.index}"
                               th:name="'telefonos[' + ${estado.index} + '].numero'"
                               th:value="${telefono.numero}">
                        <div class="text-danger"
                             th:if="${#fields.hasErrors('telefonos[__${estado.index}__].numero')}"
                             th:errors="*{telefonos[__${estado.index}__].numero}"></div>
                    </div>
                    <div class="col-auto d-flex align-items-end pb-1">
                        <button type="button" class="btn btn-outline-danger quitar-telefono">Quitar</button>
                    </div>
                </div>
            </div>
            <button type="button" class="btn btn-outline-secondary" id="agregar-telefono">Agregar teléfono</button>
            <div class="text-danger" th:if="${#fields.hasErrors('telefonos')}" th:errors="*{telefonos}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Correos electrónicos</label>
            <div id="correos">
                <div class="row g-2 mb-2 correo-fila" th:each="correo, estado : *{correosElectronicos}">
                    <div class="col">
                        <label class="form-label" th:for="'correo' + ${estado.index}">Correo electrónico</label>
                        <input class="form-control campo-correo" type="email" maxlength="255" required
                               th:id="'correo' + ${estado.index}"
                               th:name="'correosElectronicos[' + ${estado.index} + '].direccion'"
                               th:value="${correo.direccion}">
                        <div class="text-danger"
                             th:if="${#fields.hasErrors('correosElectronicos[__${estado.index}__].direccion')}"
                             th:errors="*{correosElectronicos[__${estado.index}__].direccion}"></div>
                    </div>
                    <div class="col-auto d-flex align-items-end pb-1">
                        <button type="button" class="btn btn-outline-danger quitar-correo">Quitar</button>
                    </div>
                </div>
            </div>
            <button type="button" class="btn btn-outline-secondary" id="agregar-correo">Agregar correo</button>
            <div class="text-danger" th:if="${#fields.hasErrors('correosElectronicos')}"
                 th:errors="*{correosElectronicos}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="foto">Fotografía</label>
            <input class="form-control" id="foto" type="file" accept="image/jpeg,image/png" th:field="*{foto}">
            <div class="form-text">Dejar vacío para conservar la fotografía actual.</div>
            <div class="text-danger" th:if="${#fields.hasErrors('foto')}" th:errors="*{foto}"></div>
        </div>

        <button class="btn btn-primary" type="submit">Guardar cambios</button>
        <a class="btn btn-link" th:href="@{/contactos/{id}(id=${id})}">Cancelar</a>
        <a class="btn btn-link" th:href="@{/contactos}">Ver contactos</a>
    </form>

    <template id="plantilla-telefono">
        <div class="row g-2 mb-2 telefono-fila">
            <div class="col">
                <label class="form-label" for="">Teléfono</label>
                <input class="form-control campo-telefono" type="tel" maxlength="50" required>
            </div>
            <div class="col-auto d-flex align-items-end pb-1">
                <button type="button" class="btn btn-outline-danger quitar-telefono">Quitar</button>
            </div>
        </div>
    </template>

    <template id="plantilla-correo">
        <div class="row g-2 mb-2 correo-fila">
            <div class="col">
                <label class="form-label" for="">Correo electrónico</label>
                <input class="form-control campo-correo" type="email" maxlength="255" required>
            </div>
            <div class="col-auto d-flex align-items-end pb-1">
                <button type="button" class="btn btn-outline-danger quitar-correo">Quitar</button>
            </div>
        </div>
    </template>
</main>
<script th:src="@{/webjars/bootstrap/5.3.9/js/bootstrap.bundle.min.js}"></script>
<script>
    function reindexar(selector, prefijo, campo, botonClase) {
        const filas = document.querySelectorAll(selector);
        filas.forEach(function (fila, indice) {
            const entrada = fila.querySelector('input');
            entrada.name = prefijo + '[' + indice + '].' + campo;
            entrada.id = prefijo + indice;
            fila.querySelector('label').setAttribute('for', entrada.id);
            const boton = fila.querySelector('.' + botonClase);
            boton.disabled = filas.length === 1;
        });
    }

    function reindexarTodo() {
        reindexar('.telefono-fila', 'telefonos', 'numero', 'quitar-telefono');
        reindexar('.correo-fila', 'correosElectronicos', 'direccion', 'quitar-correo');
    }

    document.getElementById('agregar-telefono').addEventListener('click', function () {
        const plantilla = document.getElementById('plantilla-telefono');
        document.getElementById('telefonos').appendChild(plantilla.content.cloneNode(true));
        reindexarTodo();
    });

    document.getElementById('agregar-correo').addEventListener('click', function () {
        const plantilla = document.getElementById('plantilla-correo');
        document.getElementById('correos').appendChild(plantilla.content.cloneNode(true));
        reindexarTodo();
    });

    document.getElementById('telefonos').addEventListener('click', function (evento) {
        if (evento.target.classList.contains('quitar-telefono')) {
            evento.target.closest('.telefono-fila').remove();
            reindexarTodo();
        }
    });

    document.getElementById('correos').addEventListener('click', function (evento) {
        if (evento.target.classList.contains('quitar-correo')) {
            evento.target.closest('.correo-fila').remove();
            reindexarTodo();
        }
    });

    document.getElementById('formulario-edicion').addEventListener('submit', reindexarTodo);
    reindexarTodo();
</script>
</body>
</html>
