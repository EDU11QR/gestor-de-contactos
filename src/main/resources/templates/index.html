<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestor de Contactos</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.9/css/bootstrap.min.css}">
</head>
<body class="container py-5">
<main>
    <h1>Gestor de Contactos</h1>
    <p>Aplicación inicial configurada con Spring Boot, Java 21 y Maven.</p>
    <div th:if="${autenticado}" class="d-flex gap-2">
        <a class="btn btn-outline-primary" th:href="@{/contactos}">Ver contactos</a>
        <a class="btn btn-primary" th:href="@{/contactos/nuevo}">Registrar contacto</a>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn btn-outline-secondary" type="submit">Cerrar sesión</button>
        </form>
    </div>
    <p class="mt-3" th:unless="${autenticado}"><a th:href="@{/login}">Iniciar sesión</a></p>
</main>
<script th:src="@{/webjars/bootstrap/5.3.9/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
