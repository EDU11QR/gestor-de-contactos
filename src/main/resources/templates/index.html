<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(~{::contenido}, 'Inicio', 'inicio', ${!autenticado})}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestor de Contactos</title>
</head>
<body>
<div th:fragment="contenido">
    <section class="app-card">
        <div class="app-card__cabecera">
            <h1 class="app-card__titulo">Gestor de Contactos</h1>
            <p class="app-card__descripcion">Administre los contactos de clientes y proveedores desde un único lugar.</p>
        </div>
        <div class="app-card__cuerpo">
            <div class="app-acciones" th:if="${autenticado}">
                <a class="btn btn-outline-primary" th:href="@{/contactos}">Ver contactos</a>
                <a class="btn btn-primary" th:href="@{/contactos/nuevo}">Registrar contacto</a>
            </div>
            <p class="mb-0" th:unless="${autenticado}">
                <a class="btn btn-primary" th:href="@{/login}">Iniciar sesión</a>
            </p>
        </div>
    </section>
</div>
</body>
</html>
