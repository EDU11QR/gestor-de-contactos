<header class="app-topbar" th:fragment="header(titulo)">
    <div class="app-topbar__inner">
        <div>
            <p class="app-topbar__seccion mb-0">Panel principal</p>
            <p class="app-topbar__titulo h4 mb-0" th:text="${titulo}">Panel</p>
        </div>
        <form class="m-0" th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn btn-sm btn-outline-secondary" type="submit">Cerrar sesión</button>
        </form>
    </div>
</header>
