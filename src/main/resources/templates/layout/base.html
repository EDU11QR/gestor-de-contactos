<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(contenido, titulo, activo, publico)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Gestor de Contactos</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.9/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="app-body" th:classappend="${publico} ? 'app-body--publico' : 'app-body--privado'">
<th:block th:unless="${publico}">
    <div th:replace="~{layout/fragments/sidebar :: sidebar(${activo})}"></div>
    <div class="app-panel">
        <div th:replace="~{layout/fragments/header :: header(${titulo})}"></div>
        <div th:replace="~{layout/fragments/alerts :: alerts}"></div>
        <main class="app-contenido" th:insert="${contenido}"></main>
        <div th:replace="~{layout/fragments/footer :: footer(false)}"></div>
    </div>
</th:block>
<th:block th:if="${publico}">
    <header class="app-public-header">
        <div class="container-fluid app-public-header__inner">
            <a class="app-brand" th:href="@{/}">Gestor de Contactos</a>
            <a class="btn btn-sm btn-outline-primary" th:href="@{/login}">Iniciar sesión</a>
        </div>
    </header>
    <main class="app-contenido app-contenido--publico" th:insert="${contenido}"></main>
    <div th:replace="~{layout/fragments/footer :: footer(true)}"></div>
</th:block>
<script th:src="@{/webjars/bootstrap/5.3.9/dist/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
